[package]
name = "polars-iptools"
version = "0.2.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/erichutchins/polars_iptools"
readme = "README.md"

[lib]
name = "polars_iptools"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
pyo3-polars = { version = "0.28.0", features = [
    "derive",
    "dtype-struct",
    "dtype-extension",
    "lazy",
] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.55", features = [
    "performant",
    "lazy",
    "array_count",
    "ndarray",
    "dtype-array",
    "dtype-struct",
    "dtype-extension",
], default-features = false }
polars-arrow = "0.55.2"
polars-core = { version = "0.55.2", features = ["dtype-extension"], default-features = false }
maxminddb = { version = "0.30.0", features = ["mmap"] }
iptrie = "0.11.1"
ipnet = "2.12.1"
thiserror = "2.0"
ip-extract = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "ip_benchmarks"
harness = false

[lints.clippy]
collapsible_if = "allow"

[profile.release]
codegen-units = 1
strip = "symbols"
lto = "fat"
opt-level = 3
